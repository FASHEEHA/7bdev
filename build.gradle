
plugins {
    id 'application'
}

group = 'com.example'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.25.0'
}

application {
    mainClass = 'com.example.Main'
}

test {
    useJUnitPlatform()
}
